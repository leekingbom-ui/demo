<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公域订单转私域 Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="demo-shell">
      <section class="screen screen--app" id="apply-screen" aria-label="公域订单转私域申请页面">
        <header class="nav-bar">
          <a class="nav-action" href="#apply-screen">返回</a>
          <h1 class="nav-title">公域订单转私域</h1>
          <a class="nav-action nav-action--right" href="#detail-screen">订单明细</a>
        </header>

        <div class="screen-body screen-body--with-footer">
          <section class="notice-card">
            <p class="notice-text">填写说明规则</p>
            <p class="notice-text">运营可配置</p>
          </section>

          <section class="content-card form-card">
            <form class="application-form" id="application-form" novalidate>
              <div class="field-group">
                <label class="field-label" for="fan-phone">输入粉丝手机号：</label>
                <input
                  class="text-input"
                  id="fan-phone"
                  name="fanPhone"
                  type="tel"
                  inputmode="numeric"
                  autocomplete="tel"
                  placeholder="需确认粉丝已通过该手机号注册VTN成为你的客户"
                />
              </div>

              <div class="field-group">
                <label class="field-label" for="order-id">输入公域订单号：</label>
                <input
                  class="text-input"
                  id="order-id"
                  name="orderId"
                  type="text"
                  autocomplete="off"
                  placeholder="需填写满足转私域的公域订单号"
                />
              </div>

              <p class="form-feedback" id="form-feedback" aria-live="polite">
                提交后会写入运营数据库，页面仅展示当前设备最近提交的脱敏记录。
              </p>
            </form>
          </section>
        </div>

        <footer class="screen-footer">
          <button
            class="primary-button"
            id="submit-application"
            form="application-form"
            type="submit"
          >
            提交申请
          </button>
        </footer>
      </section>

      <section class="screen screen--detail" id="detail-screen" aria-label="公转私订单明细页面">
        <header class="nav-bar">
          <a class="nav-action" href="#apply-screen">返回</a>
          <h1 class="nav-title">公转私订单明细</h1>
          <span class="nav-action nav-action--ghost">返回</span>
        </header>

        <div class="screen-body">
          <section class="notice-card">
            <p class="notice-text">公转私订单说明规则</p>
            <p class="notice-text">运营可配置</p>
          </section>

          <section class="detail-summary">
            <h2 class="section-title">当前设备最近提交记录</h2>
            <p class="section-note">仅展示当前设备提交的脱敏记录，完整手机号只保存在运营数据库中。</p>
          </section>

          <p class="content-card empty-state" id="empty-state">还没有提交记录</p>

          <section class="order-list" id="order-list" aria-label="订单记录"></section>

          <template id="order-card-template">
            <article class="content-card order-card">
              <div class="order-head">
                <p class="meta-text" data-field="created-at"></p>
                <span class="status-chip" data-field="status-chip"></span>
              </div>
              <div class="profile-row">
                <img class="avatar-image" src="./avatar-01.jpg" alt="当前设备提交头像" />
                <div class="profile-copy">
                  <p class="name-text">当前设备提交</p>
                  <p class="sub-copy" data-field="masked-phone"></p>
                </div>
              </div>
              <div class="order-info-group">
                <p class="info-label">公域订单号</p>
                <p class="info-text" data-field="order-id"></p>
              </div>
              <p class="status-line">
                <span class="status-label">处理进度</span>
                <span class="status-value" data-field="status-detail"></span>
              </p>
            </article>
          </template>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
